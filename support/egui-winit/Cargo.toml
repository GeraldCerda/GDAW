[package]
name = "egui-winit"
version = "0.36.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "GDAW input adapter based on egui-winit 0.36.2"
repository = "https://github.com/GeraldCerda/GDAW"

[features]
android-game-activity = ["winit/android-game-activity"]
android-native-activity = ["winit/android-native-activity"]
links = ["webbrowser"]
accesskit = ["dep:accesskit_winit"]
bytemuck = ["egui/bytemuck","dep:bytemuck"]
clipboard = ["arboard","bytemuck","smithay-clipboard"]
default = ["clipboard","links","wayland","winit/default","x11"]
serde = ["egui/serde","dep:serde"]
wayland = ["winit/wayland","bytemuck"]
x11 = ["winit/x11","bytemuck"]

[dependencies]
accesskit_winit = { version = "0.32.0", optional = true }
bytemuck = { version = "1.25", optional = true }
document-features = { version = "0.2.12", optional = true }
egui = { version = "0.36.2", default-features = false }
log = { version = "0.4.33", features = ["std"] }
profiling = { version = "1.0", default-features = false }
raw-window-handle = { version = "0.6.2" }
serde = { version = "1.0", optional = true, features = ["derive"] }
web-time = { version = "1.1" }
webbrowser = { version = "1.2", optional = true }
winit = { version = "0.30.13", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6", optional = true, default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.4" }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std","NSThread"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std","objc2-core-foundation","UIApplication","UIGeometry","UIResponder","UIScene","UISceneDefinitions","UIView","UIWindow","UIWindowScene"] }

[target.'cfg(any(target_os="linux", target_os="dragonfly", target_os="freebsd", target_os="netbsd", target_os="openbsd"))'.dependencies]
smithay-clipboard = { version = "0.7.2", optional = true }
wayland-cursor = { version = "0.31.14", optional = true, default-features = false }
