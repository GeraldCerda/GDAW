name: Desktop verification

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Fetch exact source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build native desktop binary
        run: |
          cargo +stable build --locked --release --target aarch64-apple-darwin -p soundcraft
          test -x target/aarch64-apple-darwin/release/soundcraft
          file target/aarch64-apple-darwin/release/soundcraft
